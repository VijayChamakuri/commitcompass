name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy src
      - name: Tests (offline synthetic git repo + README-matches-results check)
        run: uv run pytest -q --cov=commitbench --cov-report=term
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - name: SWE-bench replay on the flask instances (network, no dense)
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import subprocess
          from commitbench.swebench import fetch, load
          from commitbench.swe_replay import replay
          fetch(Path("data/swebench_lite.jsonl"))
          inst = [i for i in load(Path("data/swebench_lite.jsonl")) if i.repo == "pallets/flask"]
          subprocess.run(["git", "clone", "-q", "--filter=blob:none", "--no-checkout", "https://github.com/pallets/flask.git", "data/swe_repos/pallets_flask"], check=True)
          recs, t = replay("pallets/flask", Path("data/swe_repos/pallets_flask"), inst, Path("data/smoke.pkl"), n_train=30)
          assert t["test_records"] == 3 and t["verified_equal"] == t["verified_total"], t
          print("ok", t)
          PY
