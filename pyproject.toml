[project]
name = "commitcompass"
version = "1.0.0"
description = "Code localization trained only on git history, evaluated on SWE-bench Lite against published baselines."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.9.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
]

[project.scripts]
commitcompass = "commitcompass:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # long lines only occur in HTML/SQL string templates; the formatter wraps code

[tool.ruff.lint.isort]
known-first-party = ["commitcompass"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
